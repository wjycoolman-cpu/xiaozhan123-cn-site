function configureLayout(ids,columns,rows){const sig=ids.join(',');if(sig===layoutSignature)return;layoutSignature=sig;keyboard.replaceChildren();keyboard.style.gridTemplateColumns='repeat('+columns+',minmax(0,1fr))';for(let col=0;col<columns;col++){const column=document.createElement('div');column.className='column';column.style.gridTemplateRows='repeat('+rows+',minmax(0,1fr))';for(let row=0;row<rows;row++)column.appendChild(cells[ids[row*columns+col]]);keyboard.appendChild(column);}layout();}
function layout(){requestAnimationFrame(()=>requestAnimationFrame(reportGeometry));}
function reportGeometry(){try{for(const key of keys)if(key.isConnected)key.style.setProperty('--sequence-font',Math.max(14,Math.min(36,key.clientHeight-36))+'px');const data={width:innerWidth,height:innerHeight,keys:probes.map(p=>p.isConnected?Array.from(p.children).flatMap(c=>{const q=c.getBoundingClientRect();return[q.x,q.y]}):[0,0,0,0,0,0,0,0]),screen:[]};const r=document.getElementById('screen').getBoundingClientRect();data.screen=[r.left,r.top,r.right,r.bottom];if(window.NativeGeometry)NativeGeometry.ready(JSON.stringify(data));}catch(e){if(window.NativeGeometry)NativeGeometry.failed(String(e));}}
const nodes={};for(const name of ['heading','song','big','pitch','caption','sequence','quiet','page'])nodes[name]=document.getElementById(name);
const sequenceSlots=Array.from({length:10},()=>{const slot=document.createElement('div');slot.className='slot empty';slot.innerHTML='<span class="num"></span><span class="code"></span><span class="duration"></span><i class="fill"></i>';nodes.sequence.appendChild(slot);return slot;});
let previous='',previousHeld=0,previousTarget=0;const previousHold=new Array(16).fill(-1),previousText=Object.create(null);
function textChanged(name,value){if(previousText[name]===value)return;previousText[name]=value;nodes[name].textContent=value;}
let notationFitQueued=false;
function scheduleNotationFit(){if(notationFitQueued)return;notationFitQueued=true;requestAnimationFrame(()=>{notationFitQueued=false;fitNotation();});}
function fitNotation(){for(const node of document.querySelectorAll('.has-notation')){const group=node.querySelector('.notation-group');if(!group)continue;
 const font=parseFloat(getComputedStyle(node).fontSize),box=node.getBoundingClientRect();group.style.fontSize=font+'px';const shape=group.getBoundingClientRect();
 const height=node.id==='big'?Math.min(box.height,node.parentElement.clientHeight):box.height;
 const ratio=Math.min(1,Math.max(0,box.width-1)/Math.max(1,shape.width),Math.max(0,height-1)/Math.max(1,shape.height));group.style.fontSize=(Math.floor(font*ratio*10)/10)+'px';}}
function notationParts(raw){const parts=String(raw||'').split('·').map(v=>v.trim());const parsed=[];
 for(const part of parts){const m=/^([♯♭]?)([1-7])([\u0307\u0323]*)$/.exec(part);if(!m)return null;
  parsed.push({accidental:m[1],degree:m[2],up:Array.from(m[3]).filter(c=>c==='\u0307').length,down:Array.from(m[3]).filter(c=>c==='\u0323').length});}return parsed;}
function renderNotation(node,value,numbered){const raw=String(value||''),signature=(numbered?'n:':'k:')+raw;if(node.dataset.notationSignature===signature)return;
 node.dataset.notationSignature=signature;node.dataset.raw=raw;node.setAttribute('aria-label',raw);const parts=numbered?notationParts(raw):null;node.classList.toggle('has-notation',Boolean(parts));
 if(!parts){node.textContent=raw;return;}const group=document.createElement('span');group.className='notation-group';
 parts.forEach((p,index)=>{if(index){const separator=document.createElement('span');separator.className='notation-separator';separator.textContent='·';group.appendChild(separator);}
  const note=document.createElement('span');note.className='notation-note'+(p.accidental?' has-accidental':'');note.dataset.degree=p.degree;note.dataset.octave=String(p.up-p.down);
  for(const side of ['up','down']){const lane=document.createElement('span');lane.className='octave octave-'+side;lane.setAttribute('aria-hidden','true');for(let i=0;i<p[side];i++){const dot=document.createElement('i');dot.className='octave-dot';lane.appendChild(dot);}note.appendChild(lane);}
  if(p.accidental){const accidental=document.createElement('span');accidental.className='accidental';accidental.textContent=p.accidental;note.appendChild(accidental);}
  const degree=document.createElement('span');degree.className='degree';degree.textContent=p.degree;note.appendChild(degree);group.appendChild(note);});node.replaceChildren(group);scheduleNotationFit();}
function readableCaption(value){return String(value||'').replace(/([♯♭]?[1-7])([\u0307\u0323]+)/g,(all,degree,marks)=>degree+' '+(marks[0]==='\u0307'?'高':'低')+marks.length+'八度');}
if(window.ResizeObserver){const notationResize=new ResizeObserver(scheduleNotationFit);notationResize.observe(nodes.big);for(const slot of sequenceSlots)notationResize.observe(slot.children[1]);}
const deviceStatus=document.createElement('span');deviceStatus.className='device-status';deviceStatus.innerHTML='<i class="power-led"></i><span class="battery-shell"><i class="battery-fill"></i></span><span class="battery-label"></span>';document.querySelector('.screen-pod').appendChild(deviceStatus);
const flowDots=keys.map(k=>{const n=document.createElement('i');n.className='flow-dot';k.appendChild(n);return n;});
const flowArrows=keys.map(k=>{const n=document.createElement('span');n.className='flow-arrow';n.textContent='→';k.appendChild(n);return n;});
window.updateMusic=function(data){configureLayout(data.layoutKeys,data.columns,data.rows);document.body.classList.toggle('numbered',Boolean(data.numbered));document.body.classList.toggle('chrome-collapsed',!data.chromeExpanded);document.body.classList.toggle('exporting',Boolean(data.exporting));document.body.classList.toggle('media-frame',Boolean(data.mediaFrame));
 const battery=Number(data.battery);deviceStatus.querySelector('.battery-label').textContent=(battery>=0?battery+'%':'电量未知')+(data.charging?' · 充电':'');deviceStatus.querySelector('.battery-fill').style.transform='scaleX('+(battery>=0?Math.min(1,battery/100):0)+')';deviceStatus.querySelector('.power-led').classList.toggle('sounding',Number(data.outputLevel)>.0005);
 const tapDuration=Boolean(data.tapDuration);if(document.body.classList.contains('tap-duration')!==tapDuration){document.body.classList.toggle('tap-duration',tapDuration);layout();}
 document.getElementById('compactSong').textContent=data.song;const held=data.held,target=data.target;
for(let i=0;i<16;i++){const bit=1<<i;if(data.mediaFrame)keys[i].style.setProperty('--depth',Number(data.keyDepth&&data.keyDepth[i])||0);if((held&bit)!==(previousHeld&bit))keys[i].classList.toggle('active',Boolean(held&bit));if((target&bit)!==(previousTarget&bit))keys[i].classList.toggle('target',Boolean(target&bit));
const ranks=Number(data.sequenceMasks&&data.sequenceMasks[i])&3;if(keys[i].dataset.sequenceMask!==String(ranks)){keys[i].dataset.sequenceMask=String(ranks);keys[i].classList.toggle('preview',ranks!==0);keys[i].classList.toggle('preview-current',Boolean(ranks&1));keys[i].classList.toggle('preview-next',ranks===2);keys[i].style.setProperty('--sequence-color',ranks&1?'#50c7e3':'#8daeb7');for(const badge of keys[i].querySelectorAll('.sequence-badge b'))badge.style.display=(ranks&(1<<(Number(badge.dataset.rank)-1)))?'inline-flex':'none';}
const rawAction=String(data.keyActions&&data.keyActions[i]||'');const action=ranks===3?(rawAction.includes('松')?'松手':rawAction==='按住'?'按住':'点'):rawAction;const nowBadge=keys[i].querySelector('[data-rank="1"]'),nextBadge=keys[i].querySelector('[data-rank="2"]');if(nowBadge.textContent!==action)nowBadge.textContent=action;const nextText=(ranks&1)?'再点':'下一';if(nextBadge.textContent!==nextText)nextBadge.textContent=nextText;const hold=data.hold[i];if(hold!==previousHold[i]){if((hold>=0)!==(previousHold[i]>=0))keys[i].classList.toggle('holding',hold>=0);keys[i].style.setProperty('--hold',hold<0?0:hold/100);previousHold[i]=hold;}}
const fc=Number(data.flowCurrent),fn=Number(data.flowNext);
for(let i=0;i<16;i++){flowDots[i].style.display=i===fn&&fc>=0&&fn!==fc?'block':'none';flowArrows[i].style.display=i===fc&&fn>=0?'block':'none';}
if(fc>=0&&fn>=0){const a=keys[fc].getBoundingClientRect(),b=keys[fn].getBoundingClientRect();flowArrows[fc].textContent=fc===fn?'↻':'→';keys[fc].style.setProperty('--flow-angle',(fc===fn?0:Math.atan2(b.top+b.height/2-a.top-a.height/2,b.left+b.width/2-a.left-a.width/2)*180/Math.PI)+'deg');}
previousHeld=held;previousTarget=target;
textChanged('heading',data.heading+(data.mode===2?' · 跟弹':''));textChanged('song',data.song);renderNotation(nodes.big,data.label,Boolean(data.numbered));textChanged('pitch',data.pitch);
 let caption=readableCaption(data.caption);nodes.caption.dataset.raw=String(data.caption||'');
 if(tapDuration){const remaining=Array.from(caption.matchAll(/剩\s*([0-9.]+)秒/g),m=>Number(m[1]));
  if(data.holdProgress>=1)caption='点一下下一键\n音长自动补足';
  else if(data.holdProgress>=0)caption='可以松手\n音长自动补足';
  else if(!/弹完/.test(caption)){const current=data.sequence.find(v=>v.current);caption='点一下亮键\n音长自动补足，不用数秒';}}
 textChanged('caption',caption);
document.getElementById('screen').classList.toggle('has-score',data.sequence.length>0);document.getElementById('screen').classList.toggle('tap-duration',tapDuration);nodes.sequence.style.display=data.sequence.length?'grid':'none';
for(let i=0;i<10;i++){const v=data.sequence[i]||{n:0,key:'',duration:'',hold:-1},slot=sequenceSlots[i];slot.classList.toggle('empty',!v.n);slot.classList.toggle('current',Boolean(v.current));slot.classList.toggle('done',Boolean(v.done));slot.classList.toggle('holding',v.hold>=0);slot.classList.toggle('chord',Boolean(v.chord));
 const number=v.n?v.n+(v.flag?' '+v.flag:''):'';if(slot.children[0].textContent!==String(number))slot.children[0].textContent=number;
 renderNotation(slot.children[1],v.key,Boolean(data.numbered));if(slot.children[2].textContent!==String(v.duration||''))slot.children[2].textContent=v.duration||'';
 slot.querySelector('.fill').style.transform='scaleX('+(v.hold<0?0:Math.max(0,1-v.hold))+')';}
nodes.caption.classList.toggle('holding',data.holdProgress>=0);nodes.caption.classList.toggle('tap-duration',tapDuration);nodes.caption.style.setProperty('--progress',data.holdProgress<0?0:Math.max(0,1-data.holdProgress));textChanged('page',data.page||'');nodes.page.title=data.preview?'接续一排 '+data.preview:'';
textChanged('quiet',data.mode===0?'数字与符号都可以弹':data.preview?'接续一排 '+data.preview:'');};
addEventListener('resize',()=>{layout();scheduleNotationFit();});addEventListener('error',e=>{if(window.NativeGeometry)NativeGeometry.failed(String(e.message));});layout();
</script></body></html>
