<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<link rel="icon" href="data:,"><title>演奏五线谱</title>
<style>
@font-face{font-family:ScoreSC;src:url('/pocket-piano/demo/assets/native/full-score/NotoSansSC-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
:root{color-scheme:light;font-family:ScoreSC,sans-serif;color:#20303d;background:#fffefb}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column}#info{flex:none;min-height:28px;display:flex;align-items:center;gap:12px;padding:4px 12px;border-bottom:1px solid #e4e7e7;font-size:10px;line-height:19px;white-space:nowrap}
#position{color:#697880;margin-left:auto}#hint{color:#55656e;overflow:hidden;text-overflow:ellipsis}
#status{color:#1b5a9d}#viewport{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;touch-action:pan-y}
#paper{position:relative;margin:0 auto;min-height:100%}svg{display:block;overflow:visible}svg text{font-family:ScoreSC,sans-serif}
#error{display:none;position:absolute;inset:0;padding:24px;background:#fffefb;color:#863f24;font-size:13px;z-index:3}
.note-target{fill:#fffefb;fill-opacity:0;stroke:#2877bd;stroke-width:1.5;stroke-dasharray:3 2;opacity:0;pointer-events:none}
.note-target[data-state="expected"]{opacity:1;fill-opacity:.28}
.note-target[data-state="next"]{opacity:.45;stroke-width:1;stroke-dasharray:1 3}
.note-target[data-state="played"]{opacity:1;fill:#1c76c5;fill-opacity:.15;stroke:#1c76c5;stroke-width:1.4;stroke-dasharray:none}
.source-head[data-state="played"] path{fill:#146ab4!important;stroke:#146ab4!important}
#cursor{stroke:#2877bd;stroke-width:1.2;opacity:.7;pointer-events:none}
@media(max-width:500px){#info{gap:7px;padding-left:7px;padding-right:7px;font-size:9px}#hint{max-width:43vw}}
</style>
<script src="practice.js" defer></script><script src="/pocket-piano/demo/assets/native/full-score/vexflow-4.2.5.js" defer></script>
</head><body>
<div id="info"><span id="status">五线谱</span><span id="hint">虚线待弹 · 蓝色本组已按</span><span id="position"></span></div>
<div id="viewport" aria-label="演奏五线谱，可上下滑动查看声部"><div id="paper"></div><div id="error" role="alert"></div></div>
</body></html>
