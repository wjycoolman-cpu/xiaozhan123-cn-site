<!doctype html>
<html lang="zh-CN">
<head>

<body><canvas id="smoke" aria-hidden="true"></canvas><canvas id="stage" aria-label="光影钢琴，可用多指弹奏"></canvas><div id="status" role="status"></div><script src="fluid.js"></script><script src="stage.js"></script></body>
