<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#161b1b;color:#eee0c5;font:16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
header{width:min(100%,1600px);padding:12px 20px;display:flex;align-items:center;gap:20px}h1{font-size:20px;margin:0}header p{margin:0;font-size:14px;color:#c9c4b9}
#game{position:relative}canvas{display:block;width:min(100vw,calc((100vh - 80px)*16/9),1600px);height:min(56.25vw,calc(100vh - 80px),900px);outline:none;background:#101515}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#192120}progress{width:min(70vw,400px);accent-color:#d6b269}
#storage-warning{display:none;position:fixed;bottom:0;margin:0;background:#553a19;color:#fff1d7;width:100%;padding:12px 20px;z-index:9}
#menu{display:none;padding:40px;text-align:center}button{font:inherit;color:#fff0cb;background:#225361;border:1px solid #bc9a58;border-radius:6px;padding:12px 32px;cursor:pointer}
a{color:#dfc184;text-decoration:underline;text-underline-offset:4px}a:focus-visible,button:focus-visible{outline:3px solid #dfc184;outline-offset:4px}#retry{margin-top:8px}#error{max-width:600px;white-space:pre-wrap;line-height:1.6;color:#ffd7bc}

html{min-height:100%;--screen-h:100vh;--usable-w:calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));--usable-h:calc(var(--screen-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@supports(height:100dvh){html{--screen-h:100dvh}}
canvas{touch-action:none}#viewport-tools{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:8px;z-index:10}#viewport-fullscreen{min-height:44px;padding:8px 18px;font-size:16px}body:not(.game-active) #viewport-tools{display:none}
#orientation-prompt{position:fixed;inset:0;z-index:20;background:#14201ff5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:32px 24px}#orientation-prompt[hidden]{display:none}#orientation-prompt h2{font-size:28px;margin:0}#orientation-prompt p{max-width:400px;line-height:1.7;margin:0;color:#d5cbb6}#landscape-start{min-height:56px;font-weight:700}#orientation-mark{font-size:54px;color:#dfc184;line-height:1}
html:fullscreen body.game-active{height:var(--screen-h);min-height:0;overflow:hidden}html:fullscreen body.game-active header{display:none}html:fullscreen body.game-active #game{display:flex;align-items:center;justify-content:center}html:fullscreen body.game-active canvas{width:min(var(--usable-w),calc(var(--usable-h)*16/9));height:min(calc(var(--usable-w)*9/16),var(--usable-h))}html:fullscreen #viewport-tools{top:auto;bottom:max(8px,env(safe-area-inset-bottom,0px))}
html:fullscreen #viewport-fullscreen{width:44px;height:44px;padding:0;font-size:0;border-radius:22px}html:fullscreen #viewport-fullscreen::before{content:'⤢';font-size:25px}html:fullscreen #viewport-fullscreen[aria-pressed=true]::before{content:'⤡'}
@media(max-width:1000px) and (max-height:600px){body.game-active{height:var(--screen-h);min-height:0;overflow:hidden}body.game-active header{display:none}body.game-active #game{display:flex;align-items:center;justify-content:center}body.game-active canvas{width:min(var(--usable-w),calc(var(--usable-h)*16/9));height:min(calc(var(--usable-w)*9/16),var(--usable-h))}#viewport-tools{top:auto;bottom:max(8px,env(safe-area-inset-bottom,0px));right:max(4px,env(safe-area-inset-right,0px))}#viewport-fullscreen{width:44px;height:44px;padding:0;font-size:0;border-radius:22px}#viewport-fullscreen::before{content:'⤢';font-size:25px}#viewport-fullscreen[aria-pressed=true]::before{content:'⤡'}}
body.load-failed #game{min-height:360px}body.load-failed #loading{padding:20px;gap:12px}body.load-failed #error{font-size:16px}#loading p{max-width:min(90vw,600px)}

</style>
<header><h1>天空传说</h1><p>网页试玩</p></header>
