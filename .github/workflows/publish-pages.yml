name: Publish small site with playable SkyMyth
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Download approved game release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(python3 -c "import json;print(json.load(open('game-releases/skymyth-r104.json'))['release_tag'])")
          archive_name=$(python3 -c "import json;print(json.load(open('game-releases/skymyth-r104.json'))['archive']['name'])")
          mkdir -p /tmp/skymyth-release
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive_name" --dir /tmp/skymyth-release
          mkdir -p /tmp/lastlight-preview11
          gh release download lastlight-preview11-web --repo "$GITHUB_REPOSITORY" --pattern LastLight-preview11-site.zip --dir /tmp/lastlight-preview11
          # BEGIN LASTLIGHT FEEDBACK15 DOWNLOAD
          release_tag=$(python3 -c "import json;print(json.load(open('game-releases/lastlight-feedback15.json'))['release_tag'])")
          archive_name=$(python3 -c "import json;print(json.load(open('game-releases/lastlight-feedback15.json'))['archive']['name'])")
          mkdir -p /tmp/lastlight-feedback15
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive_name" --dir /tmp/lastlight-feedback15
          # END LASTLIGHT FEEDBACK15 DOWNLOAD
      - name: Assemble current site and verified game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,subprocess,zipfile
          root=Path.cwd();out=root/'_site';out.mkdir()
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in filter(None,files):
              if name.startswith('.github/'):
                  continue
              source=root/name
              assert source.is_file() and not source.is_symlink(),name
              dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,dest)
          manifest=json.loads((root/'game-releases/skymyth-r104.json').read_text())
          archive=Path('/tmp/skymyth-release')/manifest['archive']['name']
          assert archive.name==manifest['archive']['name'] and archive.suffix=='.zip'
          assert archive.stat().st_size==manifest['archive']['bytes']
          with archive.open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==manifest['archive']['sha256']
          with zipfile.ZipFile(archive) as z:
              assert sorted(z.namelist())==sorted(manifest['files'])
              for name,wanted in manifest['files'].items():
                  rel=Path(name);assert not rel.is_absolute() and '..' not in rel.parts
                  raw=z.read(name)
                  assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest().upper()==wanted['sha256']
                  dest=out/'skymyth'/rel;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          overlays=manifest.get('overlays',{})
          for name,wanted in overlays.items():
              rel=Path(name);assert not rel.is_absolute() and '..' not in rel.parts
              source=root/'skymyth'/rel;raw=source.read_bytes()
              assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest().upper()==wanted['sha256']
              dest=out/'skymyth'/rel;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          if any(name.endswith('.host.js') for name in overlays):
              for name in manifest['files']:
                  if name.endswith('.host.js') and name not in overlays:
                      (out/'skymyth'/name).unlink()
          current=json.loads((root/'game-releases/lastlight-preview11.json').read_text())
          archive=Path('/tmp/lastlight-preview11/LastLight-preview11-site.zip')
          assert archive.stat().st_size==current['archive']['bytes']
          with archive.open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==current['archive']['sha256']
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist())==9 and sorted(z.namelist())==sorted(current['files'])
              for name,wanted in current['files'].items():
                  rel=Path(name);assert not rel.is_absolute() and '..' not in rel.parts and len(rel.parts)==1
                  raw=z.read(name)
                  assert len(raw)==wanted['bytes'] and hashlib.sha256(raw).hexdigest().lower()==wanted['sha256'].lower()
                  dest=out/'last-defense'/'1.10.0.2-preview11'/rel;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
          # BEGIN LASTLIGHT FEEDBACK15 ASSEMBLY
          feedback15 = json.loads((root / 'game-releases/lastlight-feedback15.json').read_text())
          assert feedback15['schema'] == 'lastlight-public-preview/v2'
          assert feedback15['status'] == 'actual_export_verified'
          assert feedback15['stage'] == 'technical_preview'
          assert feedback15['revision'] == 'feedback15'
          assert feedback15['release_tag'] == 'lastlight-feedback15-web'
          assert feedback15['site_route'] == 'last-defense/1.10.0.3-feedback15'
          assert feedback15['archive']['name'] == 'LastLight-feedback15-site.zip'
          assert feedback15['profile']['pwa'] is True
          assert feedback15['profile']['threads'] is False
          assert feedback15['profile']['canvas_resize_policy'] == 2
          assert feedback15['profile']['cache_prefix'] == feedback15['profile']['manifest_name'] + '-sw-cache-'
          assert feedback15['export_evidence']['passed'] is True
          assert feedback15['claims']['human_acceptance'] == 'unverified'
          assert feedback15['final_visual_accepted'] is False
          archive = Path('/tmp/lastlight-feedback15') / feedback15['archive']['name']
          assert archive.is_file() and archive.stat().st_size == feedback15['archive']['bytes']
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest().lower() == feedback15['archive']['sha256'].lower()
          wanted = feedback15['files']
          assert isinstance(wanted, dict) and len(wanted) >= 12
          destination_root = out / Path(feedback15['site_route'])
          assert not destination_root.exists()
          with zipfile.ZipFile(archive) as bundle:
              infos = bundle.infolist()
              names = [info.filename for info in infos]
              assert len(names) == len(set(names)) == len({name.casefold() for name in names})
              assert not any(info.is_dir() for info in infos)
              assert sorted(names) == sorted(wanted)
              for info in infos:
                  name = info.filename
                  rel = Path(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  assert '\\' not in name and not rel.is_absolute() and '..' not in rel.parts
                  assert all(part not in ('', '.') for part in rel.parts)
                  assert mode != 0o120000
                  raw = bundle.read(info)
                  expected = wanted[name]
                  assert len(raw) == expected['bytes']
                  assert hashlib.sha256(raw).hexdigest().lower() == expected['sha256'].lower()
                  dest = destination_root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)
          assert (destination_root / 'index.html').is_file()
          assert (destination_root / feedback15['profile']['service_worker']).is_file()
          legacy_root = out / 'last-defense' / '1.10.0.2-ready14'
          legacy_root.mkdir(parents=True, exist_ok=True)
          legacy_redirect = '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../1.10.0.3-feedback15/index.html"><link rel="canonical" href="../1.10.0.3-feedback15/index.html"><title>LastLight Feedback15</title><p><a href="../1.10.0.3-feedback15/index.html">Open LastLight Feedback15</a></p><script>location.replace("../1.10.0.3-feedback15/index.html"+location.search+location.hash)</script>'
          (legacy_root / 'index.html').write_bytes(legacy_redirect.encode('utf-8'))
          legacy_worker = b"'use strict';\n\n// Compatibility worker for the retired Ready14 route only. Its registration\n// scope remains /last-defense/1.10.0.2-ready14/ because the worker is served\n// from that directory without a Service-Worker-Allowed scope override.\nconst READY14_SCOPE = new URL(self.registration.scope);\nconst FEEDBACK15_ENTRY = new URL('../1.10.0.3-feedback15/index.html', READY14_SCOPE).href;\n\nself.addEventListener('install', (event) => {\n\tevent.waitUntil(self.skipWaiting());\n});\n\nself.addEventListener('activate', (event) => {\n\t// Claim existing Ready14 clients so their later requests use this worker.\n\t// Do not navigate or reload them: an in-progress old game keeps running.\n\tevent.waitUntil(self.clients.claim());\n});\n\nself.addEventListener('fetch', (event) => {\n\tconst request = event.request;\n\tif (request.method !== 'GET') {\n\t\treturn;\n\t}\n\n\tlet requestURL;\n\ttry {\n\t\trequestURL = new URL(request.url);\n\t} catch (_) {\n\t\treturn;\n\t}\n\n\tconst isReady14Navigation = request.mode === 'navigate'\n\t\t&& requestURL.origin === READY14_SCOPE.origin\n\t\t&& requestURL.pathname.startsWith(READY14_SCOPE.pathname);\n\tif (isReady14Navigation) {\n\t\tevent.respondWith(Promise.resolve(Response.redirect(FEEDBACK15_ENTRY, 302)));\n\t\treturn;\n\t}\n\n\t// Preserve every existing Godot cache and consult all of them first. This\n\t// keeps audio worklets and other assets available to an already-running old\n\t// client. Only a cache miss reaches the network; nothing is rewritten.\n\tevent.respondWith(caches.match(request).then((cached) => cached || fetch(request)));\n});\n"
          assert len(legacy_worker) == 1540
          assert hashlib.sha256(legacy_worker).hexdigest() == 'c45e7f5f21f1a4a5e63c9886351cda60e43d56cc4017cfefe2019197ede0758a'
          (legacy_root / 'index.service.worker.js').write_bytes(legacy_worker)
          legacy_discovery = "<script data-lastlight-ready14-update>\nif ('serviceWorker' in navigator) {\n  const legacyScope = new URL('/last-defense/1.10.0.2-ready14/', location.origin).href;\n  navigator.serviceWorker.getRegistration(legacyScope + 'index.html').then(registration => {\n    if (registration && registration.scope === legacyScope) return registration.update();\n  }).catch(() => console.warn('LastLight legacy update check unavailable'));\n}\n</script>"
          site_home = out / 'index.html'
          site_home_html = site_home.read_text(encoding='utf-8')
          assert 'data-lastlight-ready14-update' not in site_home_html
          assert '</body>' in site_home_html
          site_home.write_text(site_home_html.replace('</body>', legacy_discovery + '\n</body>', 1), encoding='utf-8')
          # END LASTLIGHT FEEDBACK15 ASSEMBLY
          assert (out/'CNAME').read_text().strip()=='xiaozhan123.cn'
          total=sum(p.stat().st_size for p in out.rglob('*') if p.is_file())
          assert total<1024*1024*1024,total
          print(json.dumps({'site_bytes':total,'game_files':len(manifest['files']),'game_revision':manifest['revision']}))
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
