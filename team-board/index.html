/* Shared masthead and the original, uncropped artwork in a close-fitting viewport. */
.topbar {display:flex;justify-content:space-between;gap:12px;padding:8px 18px;border-radius:9px}
.identity {display:flex;align-items:center;gap:14px;min-width:0}
.identity-mark {display:grid;place-items:center;width:74px;height:62px;background:white;border:0;padding:2px;cursor:zoom-in}
.identity-mark svg {width:100%;height:100%;stroke:none}
.identity strong,.identity small {display:block}
.identity strong {font-size:clamp(20px,1.55vw,29px);color:#153454;letter-spacing:.05em}
.identity small {margin-top:2px;font-size:14px;color:var(--muted)}
#logo-dialog {width:min(600px,92vw);padding:24px;border:1px solid var(--line);border-radius:12px;text-align:center}
#logo-dialog::backdrop {background:rgba(17,33,50,.58)}
#logo-dialog svg {display:block;width:100%;height:min(55vh,430px);stroke:none;margin:0 auto 16px}
body:not(.visiting) #visit,.visiting .workspace,.visiting .staff-only,.visiting .local-note {display:none}
.visiting .shell {max-width:2000px;padding:clamp(12px,2.2vh,26px) clamp(18px,3.8vw,70px);gap:clamp(12px,1.8vh,22px)}
.visiting .topbar {box-shadow:none}
#visit {flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(12px,2vh,24px)}
.visit-hero {min-height:0;flex:1;display:grid;grid-template-columns:.87fr 1.13fr;background:#fff;border:1px solid #dce2e8;border-radius:10px;overflow:hidden}
.visit-copy {display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;padding:clamp(22px,3.1vw,58px)}
.overline {margin:0 0 clamp(8px,1.4vh,20px);font-size:clamp(15px,1.2vw,22px);color:var(--blue);font-weight:650;letter-spacing:.04em}
.overline span {margin:0 10px;color:#647a90}
.visit-copy h1 {margin:0;color:#152c43;font-size:clamp(36px,min(4.1vw,6.4vh),80px);font-weight:720;line-height:1.14;letter-spacing:.015em}
.visit-copy em {font-style:normal;color:var(--blue)}
.visit-copy .lead {max-width:26em;margin:clamp(12px,1.75vh,22px) 0;color:#42596d;font-size:clamp(16px,1.28vw,25px);line-height:1.65;text-wrap:pretty}
.visit-cta {margin-top:4px;padding:9px 18px;min-height:44px;font-weight:600;font-size:clamp(15px,1.12vw,21px);gap:14px}
.visit-controls {display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.visit-controls .visit-cta {margin-top:0}
.visit-prev {min-height:44px}
.visit-photo {margin:0;position:relative;min-width:0;min-height:0;background:#e8edf2}
.visit-photo img {display:block;width:100%;height:100%;object-fit:cover;object-position:center 62%}
.visit-photo figcaption {position:absolute;right:14px;bottom:12px;color:white;background:rgba(13,30,46,.82);padding:5px 9px;border-radius:4px;font-size:clamp(12px,.9vw,17px)}
.visiting .module-heading {align-items:baseline;gap:12px;margin:0 0 7px}
.visiting .module-heading strong {margin:0}
.visiting .module-btn {font-size:clamp(15px,1.18vw,23px);min-height:clamp(44px,6.3vh,74px)}
.visiting .module-btn[aria-pressed=true] {border-color:var(--blue);background:#ebf2fb;color:var(--blue)}
@media(min-width:801px) and (max-height:660px) {
 .visiting .shell {gap:8px;padding-top:8px;padding-bottom:8px}
 .identity-mark {height:42px;width:50px}
 .visiting .topbar {min-height:0}
 .visit-copy {padding:12px 20px}
 .visiting .lead {margin:6px 0}
 .overline {margin-bottom:4px}
}
@media(max-width:800px) {
 .topbar {padding:6px 9px}
 .identity {gap:6px}

function topicSection(module,id,label) {
  const existing=module.sections.find(s=>s.id===id);
  if (existing) return {...existing,label};
  return {
    id,label,short:label,purpose:'归档'+label+'相关资料及记录。',
    collect:'收集来源：本班组确认的相关材料。',fields:'填写名称、日期、负责人及事项内容。',
    title:label+'名称',place:'关联岗位 / 对象'
  };
}

const PREVIOUS_MODULES = LEGACY_MODULES.map(m=>({
  ...m,sections:SKETCH_TOPICS[m.id].map(([id,label])=>topicSection(m,id,label))
}));

// Preserve old identifiers for existing records while presenting the current directory.
function currentModule(id,label,items){
  const previous=PREVIOUS_MODULES.find(m=>m.id===id);
  const base=previous || {id,label,icon:'spark',desc:'',sections:[]};
  return {...base,label,sections:items ? items.map(([sid,name])=>{
    const old=previous?.sections.find(s=>s.id===sid);
    return old ? {...old,label:name} : topicSection(base,sid,name);
  }) : base.sections};
}

const countBy = (items, key) => {
  const counts = new Map();
  for (const r of items) {
    const label=key(r)||'未填写';
    counts.set(label,(counts.get(label)||0)+1);
  }
  return [...counts];
};
function deadlineBand(r) {
  if (['已完成','已归档'].includes(r.status)) return '已办结';
  if (!r.deadline) return '未填计划日期';
  const days=(Date.parse(r.deadline)-Date.parse(today()))/86400000;
  if (!Number.isFinite(days)) return '未填计划日期';
  return days<0?'已逾期':days<=7?'七天内到期':'七天后到期';
}
function sectionGroups(items,layout) {
  const [kind,object]=layout;
  const byDate=(a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title,'zh-CN');
  const sorted=items.slice().sort(byDate);
  let labels, key;
  if(kind==='due') {
    labels=['已逾期','七天内到期','七天后到期','未填计划日期','已办结'];
    key=deadlineBand;
    sorted.sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999')||byDate(a,b));
  } else if(kind==='progress') {
    key=r=>r.status; labels=recordStatuses;
  } else if(kind==='history'||kind==='month') {
    key=r=>r.date.slice(0,7);
  } else {
    key=r=>r.place.trim();
  }
  const groups=new Map();
  for(const r of sorted) {
    const k=key(r)||'未填写';
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(r);
  }
  const order=labels||[...groups.keys()];
  if(!labels && ['index','object'].includes(kind)) order.sort((a,b)=>a.localeCompare(b,'zh-CN'));
  return order.filter(k=>groups.has(k)).map(k=>[k,groups.get(k)]);
}

  const [kind,object,title,detail]=layout;

  const fields=kind==='due'?[date,title,object,detail]:kind==='history'||kind==='month'?[date,object,title,detail]:[object,title,kind==='progress'?'当前状态':date,detail];
  const axis={due:'到期时段',progress:'办理状态',history:'记录月份',month:'登记月份',index:object,object:object}[kind];
  return {fields,axis};
}

// CSV uses the same columns as the existing export. A quoted field can contain a line break.
function parseRecordCSV(text) {
  const parsed = [];
  let row = [], field = '', quoted = false, closed = false;
  for (let i=0;i<text.length;i++) {
    const c=text[i];
    if (quoted) {
      if (c === '"' && text[i+1] === '"') { field+='"'; i++; }
      else if (c === '"') { quoted=false; closed=true; }
      else field+=c;
    } else if (c === ',' || c === '\n' || c === '\r') {
      row.push(field); field=''; closed=false;
      if (c!==',') {
        if (row.some(Boolean)) parsed.push(row);
        row=[];
        if (c==='\r' && text[i+1]==='\n') i++;
      }
    } else if (closed || (c === '"' && field)) throw new Error('CSV 引号格式不正确');
    else if (c === '"') quoted=true;
    else field+=c;
  }
  if (quoted) throw new Error('CSV 有未闭合的引号');
  row.push(field);
  if (row.some(Boolean)) parsed.push(row);
  return parsed;
}

async function importSectionCSV(input) {
  const file=input.files?.[0];
  const {module,section}=input.dataset;
  input.value='';
  if (!file) return;
  try {
    if (file.size>5*1024*1024) throw new Error('文件超过 5 MB');
    const [header,...lines]=parseRecordCSV((await file.text()).replace(/^\uFEFF/,''));
    if (!header || header.join(',')!==recordColumns.join(',')) throw new Error('表头与导入模板不一致');
    if (!lines.length || lines.length>5000) throw new Error('请提供 1 至 5000 条记录');
    const signature = r => JSON.stringify([r.title,r.date,r.place,r.owner,r.status,r.deadline,r.detail]);
    const known = new Set(records.filter(r=>r.module===module&&r.section===section).map(signature));
    const now=new Date().toISOString();
    const batch=lines.map((line,i)=>{
      const [title,date,place,owner,status,deadline,detail]=line;
      const validDate = value => !value || (/^\d{4}-\d{2}-\d{2}$/.test(value) && !isNaN(Date.parse(value)) && new Date(value).toISOString().startsWith(value));
      const record={id:newId(),module,section,title:title.trim(),date,place,owner,status:status||'待处理',deadline,detail,createdAt:now,updatedAt:now};
      if (line.length!==recordColumns.length || !validDate(date) || !validDate(deadline) || !validImported(record)) throw new Error(`第 ${i+2} 行字段无效`);
      return record;
    });
    const added=batch.filter(r=>{const key=signature(r);if(known.has(key))return false;known.add(key);return true;});
    if (added.length) {
      const before=records;
      records=[...records,...added];
      if (!saveData()) { records=before; throw new Error('浏览器无法保存记录，本次导入未生效'); }
    }
    render();
    tell(`已导入 ${added.length} 条，跳过 ${lines.length-added.length} 条重复记录。`);
  } catch(err) { tell(`导入失败：${err.message}`); }
}

    if(!cloud || !data.token) return '';
    return `<details class="shared-admin"><summary>成员管理</summary><div><p class="shared-intro">先在腾讯云身份认证中创建成员账号，再填写该账号的用户 ID，授权其使用留言箱。</p>
      <form id="member-add" class="shared-form"><label>用户 ID<input name="user_id" maxlength="64" required></label><label>称呼（可不填）<input name="display_name" maxlength="40"></label><button class="button">添加班组成员</button></form></div></details>`;
  }
  function messageCard(item){
    const links=item.releases?.length ? `<div class="shared-line"><span class="shared-meta">关联版本</span>${item.releases.map(r=>button(r.name,'select-version',`data-id="${r.id}"`)).join('')}</div>` : '';
    const admin=data.token ? `<form class="shared-form feedback-edit" data-id="${item.id}">
      <label>处理状态<select name="status">${['待处理','处理中','已完成','暂不采纳'].map(s=>`<option ${s===item.status?'selected':''}>${s}</option>`).join('')}</select></label>
      <label>处理说明<input name="response" maxlength="1000" value="${h(item.response)}"></label>
      <button class="button">保存处理结果</button></form>` : '';
    return `<article class="shared-box"><div class="shared-line"><strong>#${item.id} ${h(item.author)}</strong><span class="shared-status">${h(item.status)}</span><span class="shared-meta">${h(date(item.created_at))}</span></div><p>${h(item.content)}</p>${item.response?`<p class="shared-meta">处理说明：${h(item.response)}</p>`:''}${links}${admin}</article>`;
  }
  function feedbackView(){
    if(cloud && !data.member) return memberAccess();
    return `${cloud?memberAccess():''}<p class="shared-intro">提出建议后，${cloud?'班组成员':'大家'}可以查看留言和处理进展。</p>
      <form id="feedback-form" class="shared-form"><label>称呼（可不填）<input name="author" maxlength="40"></label><label>留言内容<textarea name="content" maxlength="1000" required></textarea></label><button class="button primary">提交留言</button></form>
      <div class="shared-list">${data.feedback.length?data.feedback.map(messageCard).join(''):'<p class="shared-intro">还没有留言。</p>'}</div>${adminAccess()}${memberManagement()}`;
  }
  function treeNode(r, visited){
    if(visited.has(r.id)) return '';
    const next=new Set(visited);next.add(r.id);
    const children=data.releases.filter(c=>c.parent_id===r.id);
    return `<li><button type="button" class="node-button" data-shared="node" data-id="${r.id}" aria-pressed="${data.selected===r.id}"><strong>${h(r.name)}</strong> <span class="shared-status">${h(r.status)}</span>${r.created_at?'<br><span class="shared-meta">登记 '+h(date(r.created_at))+'</span>':''}</button>${children.length?'<ul>'+children.map(c=>treeNode(c,next)).join('')+'</ul>':''}</li>`;
  }
  function releaseForm(){
    if(!data.token) return '';
    const options=data.releases.map(r=>`<option value="${r.id}" ${r.id===data.selected?'selected':''}>${h(r.name)}</option>`).join('');
    const messages=data.feedback.filter(f=>f.status!=='已完成'&&f.status!=='暂不采纳');
    return `<details class="shared-admin"><summary>登记新版本</summary><div><p class="shared-intro">先查看待处理留言，再勾选本次已完成的意见。上传版本包后会自动建立关联。</p>
      <form id="release-form" class="shared-form"><label>版本名称<input name="name" maxlength="80" required></label>
      <label>从哪个版本延伸<select name="parent_id"><option value="">起始版本</option>${options}</select></label>
      <label>版本状态<select name="status"><option>测试中</option><option>已发布</option><option>已归档</option></select></label>
      <label>本次前端修改内容<textarea name="notes" maxlength="3000" required></textarea></label>
      <fieldset><legend>本次已完成的留言</legend>${messages.length?messages.map(f=>`<label><input type="checkbox" name="feedback_id" value="${f.id}"><span>#${f.id} ${h(f.content)}</span></label>`).join(''):'<span class="shared-meta">没有待处理留言</span>'}</fieldset>
      <label>版本下载包（ZIP 或 HTML，最大 80 MB）<input type="file" name="file" accept=".zip,.html" required></label><button class="button primary">保存版本</button></form></div></details>`;
  }
  function versionView(){
    const ids=new Set(data.releases.map(r=>r.id));
    const roots=data.releases.filter(r=>!r.parent_id||!ids.has(r.parent_id));
    const r=data.releases.find(x=>x.id===data.selected);
    const parent=r && data.releases.find(x=>x.id===r.parent_id);
    const related=r ? data.feedback.filter(f=>r.feedback_ids.includes(f.id)) : [];
    const detail = r ? `<article class="shared-box"><div class="shared-line"><h3>${h(r.name)}</h3><span class="shared-status">${h(r.status)}</span></div>
      <p class="shared-meta">来源版本：${h(parent?.name||'起始版本')}${r.created_at?' · 登记 '+h(date(r.created_at)):''}</p><p>${h(r.notes)}</p>
      <p class="shared-meta">关联留言：${cloud && !data.member?'班组成员登录后查看':related.length ? related.map(f=>'#'+f.id+' '+h(f.content)).join('；'):'暂无'}</p>
      ${data.offline ? button('下载离线网页','offline-download',`data-id="${r.id}"`) : cloud ? button('下载此版本','cloud-download',`data-id="${r.id}"`) : `<a class="button primary" href="/api/releases/${r.id}/download" download>下载此版本</a>`}
      ${data.token?`<form class="shared-form release-status" data-id="${r.id}"><label>版本状态<select name="status">${['测试中','已发布','已归档'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></label><button class="button">更新状态</button></form>`:''}</article>` : '<p class="shared-intro">暂无版本。</p>';
    return `<p class="shared-intro">${data.offline?'本机显示随网页保存的版本；下载的是离线网页。共享留言和完整服务包需要连接服务。':'这里只记录网页前端的变化；选择版本可查看来源、修改内容、关联留言和下载包。'}</p>
      <div class="shared-tree-layout"><ul class="shared-tree">${roots.map(r=>treeNode(r,new Set())).join('')}</ul>${detail}</div>${data.offline?'':(cloud?memberAccess():adminAccess())+releaseForm()+memberManagement()}`;
  }
  function traceView(){
    if(cloud && !data.member) return memberAccess();
    return `<p class="shared-intro">从留言查看处理进展，以及它落实到哪个版本。</p><ul class="shared-tree">${data.feedback.length?data.feedback.map(f=>`<li><div class="shared-box"><strong>#${f.id} ${h(f.content)}</strong> <span class="shared-status">${h(f.status)}</span>${f.response?`<p class="shared-meta">${h(f.response)}</p>`:''}</div><ul>${f.releases.length?f.releases.map(r=>`<li>${button(r.name,'select-version',`data-id="${r.id}"`)}</li>`).join(''):'<li class="shared-meta">尚未关联版本</li>'}</ul></li>`).join(''):'<li class="shared-intro">还没有留言。</li>'}</ul>`;
  }
  function render(){
    heading.textContent=data.mode==='feedback'?'留言箱':data.mode==='trace'?'留言去向':'版本记录';
    content.innerHTML=`<div class="shared-body"><nav class="shared-line" aria-label="共享功能">${button('留言箱','feedback')}${button('留言去向','trace')}${button('版本树','versions')}</nav><div id="shared-message" role="status"></div>${data.mode==='feedback'?feedbackView():data.mode==='trace'?traceView():versionView()}</div>`;
  }
  async function open(mode){
    data.mode=mode; heading.textContent=mode==='feedback'?'留言箱':mode==='trace'?'留言去向':'版本记录';
    if(!dialog.open) dialog.showModal();
    content.innerHTML='<div class="shared-body"><p class="shared-intro">正在连接共享服务…</p></div>';
    if(location.protocol==='file:'){
      data.offline=true;
      if(mode==='versions'){
        data.feedback=[];
        data.releases=[
          {id:1,name:'原离线版',parent_id:null,status:'已归档',notes:'原班组管理系统的离线版本，作为本次调整的基线。',created_at:'',feedback_ids:[]},
          {id:2,name:'栏目与留言版本',parent_id:1,status:'测试中',notes:'调整十个一级栏目和指定二级目录；增加共享留言箱、版本树及更新包下载。',created_at:'',feedback_ids:[]}
        ];
        if(!data.selected || !data.releases.some(r=>r.id===data.selected)) data.selected=2;
        render();return;
      }
      content.innerHTML='<div class="shared-body"><p>留言箱需要连接班组共享服务。当前为离线打开，留言不会发送或同步。</p><div>'+button('查看离线版本树','versions')+'</div></div>';return;
    }
    data.offline=false;
    try {await ensureCloud();const health=await api('/api/health');if(health.service!=='team-board'||!health.ready)throw new Error();await refresh();render();}
    catch(e){content.innerHTML='<div class="shared-body"><p class="shared-error">共享服务暂时连接不上，栏目仍可浏览。请检查网络后重试。</p><div>'+button('重新连接',''+mode)+'</div></div>';}
  }
  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-shared]');if(!el)return;
    const action=el.dataset.shared;
    if(action==='close'){dialog.close();return;}
    if(action==='sign-out'){
      try{await cloud.signOut();data.token='';data.member=false;data.feedback=[];await refresh();render();setMessage('已退出登录。',true);}
      catch(err){setMessage(err.message||'退出失败，请重试。');}return;
    }
    if(['feedback','versions','trace'].includes(action)){await open(action);return;}
    if(action==='node'){data.selected=Number(el.dataset.id);render();return;}
    if(action==='offline-download'){
      if(Number(el.dataset.id)===1){
        try { const response=await fetch('seed/baseline.html');if(!response.ok)throw new Error();
          download('班组管理系统-原离线版.html',await response.blob(),'text/html;charset=utf-8');
        } catch { setMessage('请从在线版本树下载原离线版。'); }
      } else download('班组管理系统-栏目与留言版本.html',localSnapshot,'text/html;charset=utf-8');
      return;
    }
    if(action==='cloud-download'){
      try{const item=data.releases.find(r=>r.id===Number(el.dataset.id));const blob=await cloud.download(item);download(item.display_name,blob,'application/octet-stream');}
      catch(err){setMessage(err.message||'下载失败，请重试。');}
      return;
    }
    if(action==='select-version'){data.selected=Number(el.dataset.id);await open('versions');}
  });
  content.addEventListener('submit',async e=>{
    e.preventDefault();const form=e.target;const fields=new FormData(form);
    try{
      if(form.id==='admin-access'){
        data.token=String(fields.get('token')||'');
        render();return;
      }
      if(form.id==='member-access'){
        const role=await cloud.signIn(String(fields.get('username')||''),String(fields.get('password')||''));
        data.member=true;data.token=role.isAdmin?'signed-in':'';
        await refresh();render();setMessage('登录成功。',true);return;
      }
      if(form.id==='member-add'){
        await cloud.addMember(String(fields.get('user_id')||'').trim(),String(fields.get('display_name')||'').trim());
        render();setMessage('成员授权已添加。',true);return;
      }
      if(form.id==='feedback-form'){
        await api('/api/feedback',{method:'POST',body:JSON.stringify({author:fields.get('author'),content:fields.get('content')})});
        await refresh();render();setMessage('留言已提交。',true);return;
      }
      if(form.classList.contains('feedback-edit')){
        await api('/api/admin/feedback/'+form.dataset.id,{method:'POST',admin:true,body:JSON.stringify({status:fields.get('status'),response:fields.get('response')})});
        await refresh();render();setMessage('处理结果已保存。',true);return;
      }
      if(form.classList.contains('release-status')){
        await api('/api/admin/releases/'+form.dataset.id+'/status',{method:'POST',admin:true,body:JSON.stringify({status:fields.get('status')})});
        await refresh();render();setMessage('版本状态已更新。',true);return;
      }
      if(form.id==='release-form'){
        fields.set('feedback_ids',JSON.stringify(fields.getAll('feedback_id').map(Number)));fields.delete('feedback_id');
        const result=await api('/api/admin/releases',{method:'POST',admin:true,body:fields});
        data.selected=result.id;await refresh();render();setMessage('版本和留言关联已保存。',true);
      }
    }catch(err){setMessage(err.message||'操作失败，请重试。');}
  });
  dialog.addEventListener('close',()=>{if(!cloud)data.token='';});
})();
</script>
</body>
</html>
