<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>管理信箱 · 小站</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./admin.css"><script type="module" src="./boot.js"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true">小</span><span>小站</span></a><button id="logout" class="button secondary" hidden>退出登录</button></header>
<main class="inbox-main"><section id="login-panel" class="login-panel"><h1>管理信箱</h1><p class="muted">登录后查看你负责的产品反馈。</p><form id="login-form"><label>用户名<input name="username" autocomplete="username" required maxlength="24"></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary" id="login-submit">登录</button></form></section>
<section id="permission-panel" class="login-panel" hidden><h2>此账号尚未开通管理权限</h2><p>请由网站管理员核实并开通你负责的产品范围。</p><label>当前账号编号<input id="account-id" readonly></label></section>
<p id="admin-status" class="form-status" role="status"></p>
<section id="inbox-panel" hidden><div class="section-heading"><h1>反馈信箱</h1><button id="refresh-inbox" class="button secondary">刷新</button></div><div class="inbox-tools"><label>产品<select id="product-filter"></select></label><label>来源<select id="source-filter"><option value="website">新信箱</option></select></label></div><div class="inbox-columns"><section><h2 class="visually-small">收到的反馈</h2><p id="list-status" role="status"></p><div id="report-list"></div><button id="next-page" class="button secondary" hidden>下一页</button></section><section id="report-detail" class="report-detail" hidden><h2 id="report-title">反馈详情</h2><p id="report-meta" class="muted"></p><p id="report-message" class="feedback-message"></p><p id="report-contact" class="muted"></p><form id="process-form"><label>处理状态<select name="status"><option value="new">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="rejected">暂不采纳</option></select></label><label>修复版本<input name="releaseVersion" maxlength="64" placeholder="例如 1.0.7"></label><label>验证记录<input name="evidenceRef" maxlength="512" placeholder="填写本次修复的验证记录"></label><button class="button primary">保存处理结果</button></form><p id="process-status" class="form-status" role="status"></p></section></div></section>
</main><footer><a href="../">返回产品中心</a><span>反馈内容只向有权限的管理员开放。</span></footer>
</body></html>
