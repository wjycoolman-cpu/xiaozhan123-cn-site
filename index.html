<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="xiaozhan123.cn 的网站筹备页面。">
  <title>网站筹备中 · xiaozhan123.cn</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='9'%20fill='%23245be5'/%3E%3Cpath%20d='M10%2010L22%2022M22%2010L10%2022'%20stroke='white'%20stroke-width='4'%20stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f4f7fb; }
    body {
      margin: 0; min-height: 100svh; padding: 28px;
      display: grid; place-items: center;
      color: #18283e;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 15% 10%, #e1edff 0, transparent 48%),
        radial-gradient(ellipse at 95% 90%, #e4f5ee 0, transparent 46%),
        #f4f7fb;
    }
    main {
      width: min(100%, 680px); padding: 56px;
      background: #fff; border: 1px solid #e4eaf2;
      border-radius: 24px; box-shadow: 0 18px 64px #243b5a0b;
    }
    .brand { margin: 0 0 48px; display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 12px; color: white; background: #245be5;
      font-size: 23px; font-weight: 700; line-height: 1;
    }
    .domain { font-size: 16px; font-weight: 650; letter-spacing: .01em; overflow-wrap: anywhere; }
    .eyebrow { margin: 0 0 16px; color: #245be5; font-size: 13px; font-weight: 650; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); line-height: 1.25; font-weight: 750; letter-spacing: -.035em; }
    .intro { max-width: 420px; margin: 22px 0 0; color: #637186; font-size: 17px; line-height: 1.85; }
    .divider { margin: 40px 0 22px; height: 1px; background: #edf0f5; }
    footer { color: #8894a6; font-size: 13px; line-height: 1.7; }
    @media (max-width: 480px) {
      body { padding: 18px; }
      main { padding: 34px 26px; border-radius: 20px; }
      .brand { margin-bottom: 40px; gap: 10px; }
      .domain { font-size: 15px; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="brand">
      <span class="mark" aria-hidden="true">x</span>
      <span class="domain">xiaozhan123.cn</span>
    </div>
    <p class="eyebrow">一个新的开始</p>
    <h1 id="page-title">网站筹备中</h1>
    <p class="intro">内容正在准备中。<br>感谢你的到访。</p>
    <div class="divider" aria-hidden="true"></div>
    <footer>xiaozhan123.cn</footer>
  </main>
</body>
</html>
